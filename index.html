<title>DIMENSION Cube</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
/* Layout: one giant cube is the whole site. Overview = cube from afar, DIM / ENS / ION filling each face edge to edge. Category = strong zoom on one vertex; everything is typeset on the faces. Flat parts: top menu, artist card (on click), player. */
:root {
  --bg: #ffffff;
  --ink: #0a0a0c;
  --mute: #6b6b73;
  --blue: #1c1cf0;
  --on-blue: #ffffff;
  --head: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0a0a0c; --ink: #f5f5f7; --mute: #9a9aa3; --blue: #4a4aff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0a0a0c; --ink: #f5f5f7; --mute: #9a9aa3; --blue: #4a4aff; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.h { font-family: var(--head); text-transform: uppercase; font-weight: 400; line-height: .9; margin: 0; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }

/* stage */
.stage { position: absolute; inset: 0; display: grid; place-items: center; perspective: 1500px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; overflow: hidden; }
.stage.drag { cursor: grabbing; }
.zoom { transform-style: preserve-3d; transform: scale(1); transition: transform 1.1s cubic-bezier(.7, 0, .2, 1); }
.zoom.in { transform: translateY(var(--zy, 11vh)) scale(var(--zin, 1.6)); }
.cube { --s: min(46vmin, 400px); width: var(--s); height: var(--s); position: relative; transform-style: preserve-3d; transform: rotateX(-35.264deg) rotateY(-45deg); transition: transform .95s cubic-bezier(.7, 0, .2, 1); }
.face { position: absolute; inset: 0; border: 2px solid var(--ink); backface-visibility: hidden; overflow: hidden; }
.s0, .s2 { background: var(--bg); color: var(--ink); }
.s1, .s3 { background: var(--ink); color: var(--bg); }
.s0 { transform: translateZ(calc(var(--s) / 2)); }
.s1 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.s2 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.s3 { transform: rotateY(270deg) translateZ(calc(var(--s) / 2)); }
.top { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.bot { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); background: var(--ink); }
.wrap { position: absolute; inset: 0; transform: rotate(var(--tr, 0deg)); }
.rot { position: absolute; inset: 0; transform: rotate(-90deg); }
.face > *, .wrap > * { transition: opacity .25s; }
.cube.swap .face > *, .cube.swap .wrap > * { opacity: 0; }

/* fitted type: JS stretches each word so its glyphs touch the box edges */
.fit { position: absolute; left: 0; top: 0; margin: 0; font-family: var(--head); font-size: 100px; line-height: 100px; text-transform: uppercase; white-space: nowrap; transform-origin: 0 0; }
button.fit { text-align: left; }
.art { cursor: pointer; }
.art:hover, .art:focus-visible { color: var(--blue); }
.top .art:hover, .top .art:focus-visible { color: var(--ink); }
.art.on { color: var(--blue); }
.top .art.on { color: var(--ink); }
.small { position: absolute; left: 5%; right: 5%; top: 4%; height: 31%; display: flex; flex-direction: column; justify-content: flex-start; gap: calc(var(--s) * .02); font-size: calc(var(--s) * .05); line-height: 1.15; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.small p { margin: 0; }
.small .lab { opacity: .7; font-weight: 400; letter-spacing: .12em; }
.small .navb { text-align: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; margin-top: auto; }
.sl { text-align: right; align-items: flex-end; }
.sr { text-align: left; align-items: flex-start; }
.tlabel { position: absolute; left: 5%; top: 3.5%; font-size: calc(var(--s) * .05); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.cube.playing .top { animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { background: var(--blue); } to { background: color-mix(in srgb, var(--blue) 70%, var(--ink)); } }

/* hud */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top-bar { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-family: var(--head); font-size: 26px; letter-spacing: .03em; display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 2px 8px 2px 2px; }
.mark { width: 24px; height: 28px; background: var(--ink); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.cats { display: flex; gap: 6px; margin-inline: auto; overflow-x: auto; scrollbar-width: none; max-width: 100%; padding: 2px; }
.cats::-webkit-scrollbar { display: none; }
.chip { padding: 8px 14px; border: 2px solid var(--ink); background: var(--bg); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.chip:hover { background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.theme { border: 2px solid var(--ink); background: var(--bg); padding: 8px 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.theme:hover { background: var(--ink); color: var(--bg); }

.arrow { position: absolute; top: 50%; width: 46px; height: 46px; margin-top: -23px; border: 2px solid var(--ink); background: var(--bg); font-size: 18px; transition: opacity .3s, transform .3s; }
.arrow:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.arrow.l { left: 16px; } .arrow.r { right: 16px; }
.hud:not(.zoomed) .arrow { opacity: 0; pointer-events: none; }
.hint { position: absolute; left: 0; right: 0; top: 70px; text-align: center; transition: opacity .3s; pointer-events: none; }
.hud.zoomed .hint { opacity: 0; }
.hint b { font-family: var(--head); font-weight: 400; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; display: block; }

.card { position: absolute; right: 16px; top: 76px; width: 250px; padding: 14px; background: var(--bg); border: 2px solid var(--ink); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .25s, transform .25s; z-index: 4; }
.card.show { opacity: 1; transform: none; pointer-events: auto; }
.card .x { position: absolute; right: 8px; top: 6px; font-size: 22px; line-height: 1; width: 28px; height: 28px; }
.card .x:hover { color: var(--blue); }
.artwrap { background: #0a0a0c; margin-top: 10px; height: 340px; padding: 10px; display: none; align-items: center; justify-content: center; }
#ctag { margin-top: 10px; }
.artwrap img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.card.hasimg .artwrap { display: flex; }
.card.hasimg .portrait { display: none; }
.card .row { display: flex; gap: 8px; margin-top: 12px; }
.btn { padding: 11px 18px; border: 2px solid var(--ink); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; flex: 1; }
.btn.fill { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.portrait { position: relative; aspect-ratio: 1 / 1.12; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, #a2a2a8, #3a3a40); overflow: hidden; margin-top: 10px; }
.portrait::before { content: ""; position: absolute; left: 50%; top: 24%; width: 32%; aspect-ratio: 1; border-radius: 50%; background: #dcdce1; transform: translateX(-50%); opacity: .55; }
.portrait::after { content: ""; position: absolute; left: 50%; top: 54%; width: 64%; aspect-ratio: 1.3; border-radius: 50% 50% 0 0; background: #dcdce1; transform: translateX(-50%); opacity: .55; }
.portrait span { position: absolute; z-index: 1; left: 0; right: 0; font-family: var(--head); text-transform: uppercase; color: var(--blue); font-size: 36px; line-height: .84; text-align: center; transform: scaleY(1.2); }
.portrait span:first-of-type { top: 10%; }
.portrait span:last-of-type { bottom: 14%; }

/* player */
.player { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px; z-index: 3; }
.play { width: 40px; height: 40px; border: 2px solid var(--bg); border-radius: 50%; display: grid; place-items: center; flex: none; }
.play:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.np { min-width: 0; flex: 0 1 230px; }
.np b { font-family: var(--head); font-weight: 400; text-transform: uppercase; font-size: 22px; line-height: 1; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np small { opacity: .65; font-size: 12px; }
.bars { flex: 1; display: flex; align-items: center; gap: 3px; height: 30px; overflow: hidden; min-width: 0; }
.bars i { width: 3px; flex: none; background: var(--bg); opacity: .5; height: 18%; }
.bars i.on { background: var(--blue); opacity: 1; }
.player[data-state="playing"] .bars i { animation: eq 1s ease-in-out infinite alternate; }
@keyframes eq { from { height: 14%; } to { height: var(--h, 80%); } }
.time { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .75; }

@media (max-width: 760px) {
  .cube { --s: min(62vw, 400px); }
  .zoom.in { transform: translateY(var(--zy-m, 12vh)) scale(var(--zin-m, 2.4)); }
  .brand span:last-child { display: none; }
  .top-bar { flex-wrap: wrap; row-gap: 10px; }
  .cats { order: 3; width: 100%; margin: 0; }
  .arrow { top: auto; bottom: 76px; margin: 0; width: 40px; height: 40px; }
  .arrow.l { left: 16px; } .arrow.r { right: 16px; }
  .card { right: 16px; left: 16px; width: auto; top: auto; bottom: 126px; display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; }
  .card .portrait { margin: 0; }
  .artwrap { height: 190px; padding: 6px; margin-top: 4px; }
  .card .row { margin-top: 8px; }
  .hint { top: 112px; }
  .bars { display: none; }
}
@media (prefers-reduced-motion: reduce) { .zoom, .cube { transition-duration: .01s; } .player[data-state="playing"] .bars i, .cube.playing .top { animation: none; } }
</style>

<div class="stage" id="stage" aria-label="DIMENSION cube. Drag or swipe to turn it.">
  <div class="zoom" id="zoom">
    <div class="cube" id="cube">
      <div class="face s0"></div><div class="face s1"></div><div class="face s2"></div><div class="face s3"></div>
      <div class="face top" id="top"><div class="wrap" id="wrap"></div></div>
      <div class="face bot"></div>
    </div>
  </div>
</div>

<div class="hud" id="hud">
  <div class="top-bar">
    <button class="brand" id="home" type="button" aria-label="DIMENSION, back to the full cube"><span class="mark" aria-hidden="true"></span><span>DIMENSION</span></button>
    <nav class="cats" id="cats" aria-label="Categories"></nav>
    <button class="theme" id="theme" type="button" aria-label="Switch between light and dark">Black / White</button>
  </div>
  <div class="hint"><b>Choose a side</b><span class="label">Tap the cube or a category</span></div>
  <button class="arrow l" id="prev" type="button" aria-label="Previous category">&#8592;</button>
  <button class="arrow r" id="next" type="button" aria-label="Next category">&#8594;</button>

  <aside class="card" id="card" aria-live="polite">
    <button class="x" id="cx" type="button" aria-label="Close">&times;</button>
    <div><span class="label" id="crank">Top 1</span>
      <div class="artwrap" id="cwrap"><img id="cimg" alt=""></div>
      <div class="portrait" id="cport"><span id="ca"></span><span id="cb"></span></div></div>
    <div><div class="label" id="ctag"></div>
      <div class="row"><button class="btn fill" id="cplay" type="button">Play</button></div></div>
  </aside>
</div>

<div class="player" id="player" data-state="paused">
  <button class="play" id="play" type="button" aria-label="Play"><svg viewBox="0 0 16 16"><path id="ico" d="M3 1.5v13l11-6.5z"/></svg></button>
  <div class="np"><b id="ntitle">Willie Nelson</b><small id="nsub">Country / Top 1</small></div>
  <div class="bars" id="bars" aria-hidden="true"></div>
  <span class="time" id="time">00:00</span>
</div>

  function paint() { var on = Math.round((secs % 120) / 120 * 60); for (var i = 0; i < 60; i++) bars.children[i].className = i < on ? 'on' : ''; $('time').textContent = fmt(secs); }
